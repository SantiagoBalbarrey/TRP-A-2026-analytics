<title>TRP A @@SEASON@@</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: cabecera tipo estadio con líneas de cancha, barra de secciones fija y paneles de estadísticas sobre fondo de pizarra. */
:root{
  --bg:#0A1019; --surf:#111B2B; --surf2:#182540; --line:#263753; --tx:#E8EEF7; --mut:#8EA2BF;
  --acc:#35C37D; --acc-ink:#04170D; --gold:#F2B84B; --bad:#FF6F6F; --good:#35C37D;
  --hdr:#06101C; --hdr2:#0C2238; --hdr-tx:#F2F6FB; --grid:#ffffff14; --shadow:0 1px 0 #ffffff08 inset,0 8px 24px #00000040;
  --crglow:drop-shadow(0 0 1.5px #ffffffd0) drop-shadow(0 0 5px #ffffff30);
  --fd:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --fb:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#EDF1F6; --surf:#FFFFFF; --surf2:#F3F6FA; --line:#D3DCE8; --tx:#0E1A2B; --mut:#586A84;
  --acc:#0E7A46; --acc-ink:#FFFFFF; --gold:#A86F00; --bad:#C23030; --good:#0E7A46;
  --grid:#0e1a2b14; --shadow:0 1px 2px #0e1a2b14,0 6px 18px #0e1a2b0d; --crglow:none; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EDF1F6; --surf:#FFFFFF; --surf2:#F3F6FA; --line:#D3DCE8; --tx:#0E1A2B; --mut:#586A84;
  --acc:#0E7A46; --acc-ink:#FFFFFF; --gold:#A86F00; --bad:#C23030; --good:#0E7A46;
  --grid:#0e1a2b14; --shadow:0 1px 2px #0e1a2b14,0 6px 18px #0e1a2b0d; --crglow:none; color-scheme:light}
:root[data-theme="dark"]{--crglow:drop-shadow(0 0 1.5px #ffffffd0) drop-shadow(0 0 5px #ffffff30);color-scheme:dark}
*{box-sizing:border-box}
.cw{display:inline-flex;align-items:center;justify-content:center;flex:none}
.cw img.cr{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;filter:var(--crglow)}
body{background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb);margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* cabecera */
.hero{background:linear-gradient(180deg,var(--hdr) 0%,var(--hdr2) 100%);color:var(--hdr-tx);position:relative;overflow:hidden}
.hero svg.pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.hero .wrap{position:relative;padding-block:26px 20px}
.kick{font:600 12px/1 var(--fb);letter-spacing:.18em;text-transform:uppercase;color:#9FB6D1}
.hero h1{font:800 clamp(44px,8vw,84px)/.92 var(--fd);margin:8px 0 6px;letter-spacing:.01em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{margin:0;color:#B7C7DB;max-width:62ch}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;margin-top:20px;background:#ffffff1f;border:1px solid #ffffff1f;border-radius:6px;overflow:hidden}
.hstats div{background:#0a1a2dcc;padding:10px 14px}
.hstats b{display:block;font:700 28px/1 var(--fd);font-variant-numeric:tabular-nums}
.hstats span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9FB6D1}
/* navegación */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);border-bottom:3px solid var(--acc)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
.nav .wrap{display:flex;align-items:stretch;gap:2px;overflow-x:auto}
.nav button.t{background:none;border:0;color:#9FB6D1;font:700 17px/1 var(--fd);letter-spacing:.08em;text-transform:uppercase;padding:15px 16px;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
.nav button.t[aria-pressed="true"]{color:#fff;border-bottom-color:var(--gold)}
.nav button.t:hover{color:#fff}
.nav .sp{flex:1}
.nav .tools{display:flex;align-items:center;gap:6px;position:sticky;right:0;padding-left:10px;background:var(--hdr)}
.nav .th{background:none;border:1px solid #ffffff30;color:#cfdcec;border-radius:4px;padding:4px 10px;margin:9px 0;font:600 12px var(--fb);align-self:center}
main{padding-block:24px 40px}
.view[hidden]{display:none}
h2.sec{font:700 24px/1 var(--fd);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::before{content:"";width:6px;height:20px;background:var(--acc);border-radius:1px}
h3.sub{font:700 14px/1 var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:16px}
.grid>*,.card,.mgrid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.sp16{margin-top:16px}.sp24{margin-top:28px}
.note{color:var(--mut);font-size:13px}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
/* tabla */
.tw{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;min-width:640px}
table.st th{font:600 11px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:right;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.st th:nth-child(2){text-align:left}
table.st td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.st td.tm{text-align:left}
table.st tbody tr{cursor:pointer}
table.st tbody tr:hover{background:var(--surf2)}
table.st tr.zone td:first-child{box-shadow:inset 4px 0 var(--acc)}
.pos{font:700 20px var(--fd);width:34px}
.tmc{display:flex;align-items:center;gap:10px;font-weight:600}
.pts{font:800 22px var(--fd);color:var(--tx)}
.form{display:inline-flex;gap:3px}
.form i{width:16px;height:16px;border-radius:3px;font:700 10px/16px var(--fb);font-style:normal;text-align:center;color:#fff}
.form i.G{background:var(--good)}.form i.P{background:var(--bad)}.form i.E{background:#7b8aa3}
/* líderes */
.lead .row{display:grid;grid-template-columns:22px 28px 1fr auto;align-items:center;gap:8px;padding:6px 0}
.lead .row .bar{grid-column:3 / 5;height:5px;background:var(--surf2);border-radius:3px;overflow:hidden;margin-top:-2px}
.lead .row .bar i{display:block;height:100%}
.lead .v{font:700 18px var(--fd);font-variant-numeric:tabular-nums}
.lead .r1{font:700 15px var(--fd);color:var(--mut)}
/* chips y selectores */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:600 13px var(--fb)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.fchips .chip{min-width:44px;text-align:center;font:700 15px var(--fd);letter-spacing:.04em}
.tsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tsel button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:12px 6px 10px;font:700 14px var(--fd);letter-spacing:.04em;text-transform:uppercase}
.tsel button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
select.sel{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:9px 12px;min-width:0;max-width:100%;font-weight:600}
/* resultados */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
.mc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;box-shadow:var(--shadow)}
.mc:hover{border-color:var(--acc)}
.mc.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.mc .tt{display:flex;flex-direction:column;align-items:center;gap:6px;font:700 14px/1.1 var(--fd);letter-spacing:.03em;text-transform:uppercase;text-align:center;min-width:0}
.mc .sc{font:800 30px/1 var(--fd);font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.mc .sc small{display:block;font:500 11px var(--fb);color:var(--mut);letter-spacing:.06em;margin-top:4px}
.mc .w{color:var(--tx)}.mc .l{color:var(--mut)}
/* ficha de equipo */
.thero .cw img.cr,.board .cw img.cr,.hero .cw img.cr{filter:drop-shadow(0 0 1.5px #ffffffd0) drop-shadow(0 0 6px #ffffff35)}
.thero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:20px;border-radius:8px;color:#fff;position:relative;overflow:hidden;border:1px solid var(--line)}
.thero h2{font:800 clamp(30px,5vw,50px)/1 var(--fd);margin:0;text-transform:uppercase;letter-spacing:.01em}
.thero .rec{font:600 14px var(--fb);opacity:.95;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font:700 32px/1 var(--fd);font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.kpi em{display:block;font-style:normal;font-size:12px;margin-top:4px;color:var(--mut)}
.kpi em.up{color:var(--good)}.kpi em.dn{color:var(--bad)}
.hb{display:grid;grid-template-columns:minmax(80px,140px) 1fr 54px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.hb .tr{height:10px;background:var(--surf2);border-radius:2px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--acc)}
.hb .vv{text-align:right;font:700 16px var(--fd);font-variant-numeric:tabular-nums}
.stack{display:flex;height:22px;border-radius:3px;overflow:hidden;background:var(--surf2)}
.stack i{display:flex;align-items:center;justify-content:center;font:700 12px var(--fb);color:#fff;font-style:normal;min-width:0}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:6px}
.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pill{display:inline-block;font:700 12px/1 var(--fb);padding:4px 7px;border-radius:4px;color:#fff;min-width:22px;text-align:center}
.pill.G{background:var(--good)}.pill.P{background:var(--bad)}.pill.E{background:#7b8aa3}
.fx{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.fx:hover{background:var(--surf2)}
.fx .rv{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
/* comparar */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;padding:18px;border-radius:8px;border:1px solid var(--line);background:var(--surf);box-shadow:var(--shadow)}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.vs .side b{font:800 clamp(20px,3.4vw,32px)/1 var(--fd);text-transform:uppercase}
.vs .mid{font:800 28px var(--fd);color:var(--mut)}
.cmpctl{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;align-items:end}
.cmpctl label{display:flex;flex-direction:column;gap:4px;font:600 11px var(--fb);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);min-width:0}
.mr{display:grid;grid-template-columns:minmax(52px,.7fr) minmax(0,2fr) minmax(52px,.7fr);align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.mr:last-child{border:0}
.mr .lab{grid-column:1 / 4;text-align:center;font:600 12px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:-4px}
.mr .vl,.mr .vr{font:700 22px var(--fd);font-variant-numeric:tabular-nums}
.mr .vl{text-align:right}.mr .vr{text-align:left}
.mr .vl.win,.mr .vr.win{color:var(--tx)}.mr .vl:not(.win),.mr .vr:not(.win){color:var(--mut)}
.mr .bars{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.mr .bars .a,.mr .bars .b{height:12px;background:var(--surf2);display:flex}
.mr .bars .a{justify-content:flex-end;border-radius:3px 0 0 3px}.mr .bars .b{border-radius:0 3px 3px 0}
.mr .bars i{display:block;height:100%}
.mr .bars .a i{border-radius:3px 0 0 3px}.mr .bars .b i{border-radius:0 3px 3px 0}
.mr .bars i.dim{opacity:.38}
.pcs{display:block;font:500 12px/1.2 var(--fb);color:var(--mut);letter-spacing:.02em;margin-top:2px}
.gtitle{font:700 20px var(--fd);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;color:var(--acc)}
/* marcador */
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:22px 16px;border-radius:8px;color:#fff;position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--hdr),var(--hdr2))}
.board .tm{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font:800 clamp(18px,3vw,30px)/1 var(--fd);text-transform:uppercase;min-width:0}
.board .tm small{font:500 12px var(--fb);letter-spacing:.06em;color:#9FB6D1;text-transform:none}
.board .scr{font:800 clamp(48px,10vw,92px)/1 var(--fd);font-variant-numeric:tabular-nums;display:flex;gap:14px;align-items:center;justify-content:center}
.board .scr span.d{opacity:.5}
.board .info{grid-column:1 / 4;text-align:center;color:#9FB6D1;font-size:13px;letter-spacing:.06em}
.chartbox{width:100%;overflow-x:auto}
svg.ch.wide{min-width:560px}
svg.ch{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--fb)}
.ax{fill:var(--mut);font-size:11px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut);margin-top:8px;align-items:center}
.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.ft{border-top:1px solid var(--line);padding-block:22px 40px;color:var(--mut);font-size:13px}
.ft p{margin:0 0 6px;max-width:80ch}
.seas{display:flex;gap:6px;margin:2px 0 14px}
.seas button{background:#ffffff14;border:1px solid #ffffff40;color:#e6eefb;border-radius:999px;padding:6px 18px;font:700 16px var(--fd);letter-spacing:.06em}
.seas button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.cmodes{margin-bottom:14px}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tchips button{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 7px;font:600 13px var(--fb)}
.tchips button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.mvh{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;padding:16px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surf);box-shadow:var(--shadow);margin-top:6px}
.mvh .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.mvh .side b{font:800 clamp(15px,2.6vw,24px)/1.05 var(--fd);text-transform:uppercase}
.mm{padding:9px 0;border-bottom:1px solid var(--line)}.mm:last-child{border:0}
.mm .lab{text-align:center;font:600 12px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.mm .cells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.mm .cell{text-align:center;min-width:0}
.mm .cell b{display:block;font:700 22px var(--fd);font-variant-numeric:tabular-nums}
.mm .cell .bar{height:8px;background:var(--surf2);border-radius:4px;overflow:hidden;margin-top:5px}.mm .cell .bar i{display:block;height:100%}
.mm .cell:not(.win) b{color:var(--mut)}.mm .cell:not(.win) .bar i{opacity:.38}
.evopick summary{cursor:pointer;font:700 15px var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.evopick .gtitle.sm{font-size:14px;margin:12px 0 6px;color:var(--mut)}
table.evt th{white-space:normal;min-width:118px;vertical-align:bottom}table.evt th small{display:block;font-weight:500;color:var(--mut)}
table.evt td{white-space:nowrap}table.evt .ev{font-variant-numeric:tabular-nums}table.evt .ev b{font-weight:700}
table.evt th:first-child{text-align:left}table.evt th:nth-child(2){text-align:right}table.evt tbody tr{cursor:default}table.evt tr.clk{cursor:pointer}table.evt tr.clk:hover td{background:var(--surf2)}
.dl{display:block;font-style:normal;font-size:12px;color:var(--mut)}.dl.up{color:var(--good)}.dl.dn{color:var(--bad)}
.only{margin-left:8px;font:600 10px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
@media (max-width:560px){
  .hb{grid-template-columns:minmax(70px,100px) 1fr 44px}
  .board{padding:16px 8px}
  .vs{grid-template-columns:1fr auto 1fr;padding:12px 8px}
  .nav button.t{padding:14px 9px;font-size:15px;letter-spacing:.04em}
  .nav .th{padding:4px 7px}
  .mm .cell b{font-size:17px}.mm .cells{gap:6px}.mvh .side b{font-size:14px}
}
@media (prefers-reduced-motion:no-preference){.view{animation:fi .25s ease}@keyframes fi{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
